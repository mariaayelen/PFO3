<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#385778" stroke-width="2"/></marker></defs>
<rect width="1500" height="960" fill="#f8fafc"/>
<text x="750" y="55" text-anchor="middle" font-size="35" font-weight="bold" font-family="DejaVu Sans" fill="#183153">PFO3 · Arquitectura distribuida</text>
<text x="750" y="92" text-anchor="middle" font-size="19" font-family="DejaVu Sans" fill="#526479">Exploradores de la fauna de Misiones · Diseño propuesto</text>
<!-- clients -->
<rect x="70" y="170" width="255" height="170" rx="18" fill="#dcecff" stroke="#6696c5" stroke-width="3"/>
<text x="197" y="219" text-anchor="middle" font-size="26" font-weight="bold" font-family="DejaVu Sans" fill="#15395c">Clientes</text>
<text x="197" y="266" text-anchor="middle" font-size="21" font-family="DejaVu Sans">Web · Móvil</text>
<text x="197" y="302" text-anchor="middle" font-size="17" font-family="DejaVu Sans" fill="#465b70">Envían consultas</text>
<!-- balance -->
<rect x="450" y="170" width="285" height="170" rx="18" fill="#ffeed8" stroke="#d3a45d" stroke-width="3"/>
<text x="592" y="216" text-anchor="middle" font-size="24" font-weight="bold" font-family="DejaVu Sans" fill="#6a4115">Balanceador</text>
<text x="592" y="256" text-anchor="middle" font-size="21" font-family="DejaVu Sans">Nginx / HAProxy</text>
<text x="592" y="297" text-anchor="middle" font-size="17" font-family="DejaVu Sans" fill="#755e40">Reparte solicitudes</text>
<path d="M325 255 L445 255" stroke="#385778" stroke-width="3" marker-end="url(#arr)"/>
<!-- workers -->
<rect x="900" y="130" width="420" height="200" rx="18" fill="#dff5ec" stroke="#64ad91" stroke-width="3"/>
<text x="1110" y="181" text-anchor="middle" font-size="25" font-weight="bold" font-family="DejaVu Sans" fill="#1b5d47">Servidor worker 1</text>
<text x="1110" y="229" text-anchor="middle" font-size="21" font-family="DejaVu Sans">Pool de hilos</text>
<text x="1110" y="271" text-anchor="middle" font-size="18" font-family="DejaVu Sans" fill="#426b5e">Procesa consultas escolares</text>
<rect x="900" y="383" width="420" height="200" rx="18" fill="#dff5ec" stroke="#64ad91" stroke-width="3"/>
<text x="1110" y="434" text-anchor="middle" font-size="25" font-weight="bold" font-family="DejaVu Sans" fill="#1b5d47">Servidor worker 2</text>
<text x="1110" y="482" text-anchor="middle" font-size="21" font-family="DejaVu Sans">Pool de hilos</text>
<text x="1110" y="524" text-anchor="middle" font-size="18" font-family="DejaVu Sans" fill="#426b5e">Procesa consultas escolares</text>
<path d="M735 255 L820 255 L820 230 L892 230" stroke="#385778" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M820 255 L820 483 L892 483" stroke="#385778" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<!-- rabbit -->
<rect x="440" y="444" width="295" height="145" rx="18" fill="#eee5ff" stroke="#9e84d0" stroke-width="3"/>
<text x="588" y="497" text-anchor="middle" font-size="25" font-weight="bold" font-family="DejaVu Sans" fill="#583584">RabbitMQ</text>
<text x="588" y="538" text-anchor="middle" font-size="17" font-family="DejaVu Sans">Cola de mensajes</text>
<path d="M900 315 L765 315 L765 515 L738 515" stroke="#7353a5" stroke-width="2.5" stroke-dasharray="9 6" fill="none" marker-end="url(#arr)"/>
<path d="M900 545 L738 545" stroke="#7353a5" stroke-width="2.5" stroke-dasharray="9 6" fill="none" marker-end="url(#arr)"/>
<!-- storage -->
<rect x="385" y="690" width="325" height="140" rx="18" fill="#e5edf9" stroke="#7a93c5" stroke-width="3"/>
<text x="548" y="745" text-anchor="middle" font-size="26" font-weight="bold" font-family="DejaVu Sans" fill="#234777">PostgreSQL</text>
<text x="548" y="790" text-anchor="middle" font-size="19" font-family="DejaVu Sans">Datos de actividades</text>
<rect x="795" y="690" width="325" height="140" rx="18" fill="#e5edf9" stroke="#7a93c5" stroke-width="3"/>
<text x="958" y="745" text-anchor="middle" font-size="26" font-weight="bold" font-family="DejaVu Sans" fill="#234777">S3</text>
<text x="958" y="790" text-anchor="middle" font-size="19" font-family="DejaVu Sans">Archivos e imágenes</text>
<path d="M1110 583 L1110 642 L548 642 L548 682" stroke="#385778" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M1110 642 L958 642 L958 682" stroke="#385778" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="65" y="870" width="1370" height="58" rx="12" fill="#f1f5f9" stroke="#b8c6d6"/>
<text x="750" y="896" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#3d5369">Prototipo ejecutable: cliente TCP → servidor coordinador → 2 workers con pool de hilos</text>
<text x="750" y="919" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#3d5369">Nginx, RabbitMQ, PostgreSQL y S3 aparecen en el diseño; no están conectados en el código.</text>
</svg>
